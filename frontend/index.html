<!DOCTYPE html>
<html lang="en-IN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0f12" media="(prefers-color-scheme: dark)">

  <!-- NOTE: Cross-Origin-Opener-Policy cannot be set from a <meta http-equiv>
       tag - browsers ignore it there. It is sent as a real header from
       vercel.json, which is what lets the Google Sign-In popup post back. -->

  <!-- Per-page tags. scripts/prerender.mjs replaces everything between these
       markers for each public page at build time; PageMeta.jsx keeps title,
       description, canonical and robots in sync during client navigation. -->
  <!--seo:start-->
  <title>Community AI – Government Schemes, Scholarships &amp; Benefits Explained</title>
  <meta name="description"
    content="Find Indian government schemes you may be eligible for: eligibility, benefits, documents and how to apply, explained in plain language with links to official portals.">
  <link rel="canonical" href="https://communityai.co.in/">
  <meta property="og:url" content="https://communityai.co.in/">
  <meta property="og:title" content="Community AI – Government Schemes, Scholarships &amp; Benefits Explained">
  <meta property="og:description"
    content="Find Indian government schemes you may be eligible for: eligibility, benefits, documents and how to apply, explained in plain language with links to official portals.">
  <meta name="twitter:title" content="Community AI – Government Schemes, Scholarships &amp; Benefits Explained">
  <meta name="twitter:description"
    content="Find Indian government schemes you may be eligible for: eligibility, benefits, documents and how to apply, explained in plain language with links to official portals.">
  <!--seo:end-->

  <!-- Site icons -->
  <!-- SVG for modern browsers (turns white on dark tab bars); the .ico is
       the fallback for older browsers. sizes="32x32" on the .ico makes
       Chrome prefer the SVG. -->
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <!-- Social preview (Open Graph / Twitter). Crawlers need absolute URLs. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Community AI">
  <meta property="og:locale" content="en_IN">
  <meta property="og:image" content="https://communityai.co.in/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Community AI logo with the tagline: government schemes, education and local resources in your language">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://communityai.co.in/og-image.png">

  <!-- Consent Mode: analytics cookies stay off until the visitor clicks
       "Accept" on the cookie banner (src/utils/analytics.js grants it). Must run
       before the Google tag below. -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    var consented = false;
    try { consented = localStorage.getItem('cookie-consent') === 'accepted'; } catch (e) {}
    gtag('consent', 'default', {
      analytics_storage: consented ? 'granted' : 'denied',
      ad_storage: 'denied',
      ad_user_data: 'denied',
      ad_personalization: 'denied'
    });
  </script>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-E62VV5FB9M"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    // Only the live site reports to GA4. Localhost, Vercel previews and other
    // hosts load the tag but send nothing, so test traffic doesn't pollute
    // the real numbers. See docs/ANALYTICS.md.
    if (location.hostname === 'communityai.co.in' || location.hostname === 'www.communityai.co.in') {
      gtag('config', 'G-E62VV5FB9M');
    }
  </script>

  <!-- Preconnect to improve performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Google Fonts: Inter is the only family the design system uses.
       Loaded without blocking the first paint (text shows in the system font
       and switches to Inter when it arrives), which speeds up LCP. -->
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap">
  <link rel="stylesheet" media="print" onload="this.media='all'"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap">
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap">
  </noscript>
</head>

<body class="light-theme">
  <div id="root"><!--app-html--></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
