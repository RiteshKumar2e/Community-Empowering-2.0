<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Find government schemes, scholarships, learning resources and local help with Community AI, a free AI assistant that answers in your language.">
  <meta name="keywords" content="AI, community, government schemes, education, resources, accessibility">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0f12" media="(prefers-color-scheme: dark)">

  <!-- NOTE: Cross-Origin-Opener-Policy cannot be set from a <meta http-equiv>
       tag - browsers ignore it there. The two meta tags that used to live here
       did nothing. It is now sent as a real header from vercel.json, which is
       what actually lets the Google Sign-In popup post its credential back. -->

  <title>Community AI – Government Schemes, Education &amp; Resources in Your Language</title>
  <link rel="canonical" href="https://communityai.co.in/">

  <!-- Site icons -->
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <!-- Social preview (Open Graph / Twitter). Crawlers need absolute URLs. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Community AI">
  <meta property="og:url" content="https://communityai.co.in/">
  <meta property="og:title" content="Community AI – Government Schemes, Education &amp; Resources">
  <meta property="og:description"
    content="Find government schemes, learning resources and local help with an AI assistant that speaks your language.">
  <meta property="og:image" content="https://communityai.co.in/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Community AI logo with the tagline: government schemes, education and local resources in your language">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Community AI – Government Schemes, Education &amp; Resources">
  <meta name="twitter:description"
    content="Find government schemes, learning resources and local help with an AI assistant that speaks your language.">
  <meta name="twitter:image" content="https://communityai.co.in/og-image.png">

  <!-- Preconnect to improve performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Google Fonts: Inter is the only family the design system uses -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;650;700&display=swap"
    rel="stylesheet">
</head>

<body class="light-theme">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
